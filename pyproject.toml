[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webctl"
version = "0.1.0"
description = "Web 题通用工具：会话化的请求 + 侦察报告 + 高频单点操作（JWT/编码/Cookie/笔记）"
requires-python = ">=3.9"
dependencies = []          # 刻意零依赖，只用标准库

[project.scripts]
webctl = "webctl.cli:main"

[tool.setuptools]
packages = ["webctl", "webctl.core", "webctl.commands"]

[tool.setuptools.package-data]
webctl = ["data/*.json", "templates/*.md"]
